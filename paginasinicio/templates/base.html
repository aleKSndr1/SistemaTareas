<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django CRUD Application SIX O SEVEN</title>
    <!-- CDN de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">Navbar</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/">INICIO</a>
                        </li>

                        {% if user.is_authenticated %}
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'TAREA' %}">TAREAS PENDIENTES</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'TAREASCOMPLETAS' %}">TAREAS COMPLETAS</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'CTAREA' %}">CREAR TAREA</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'CSESION' %}">CERRAR SESION</a>
                            </li>
                        {% else %}
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'REGISTRO' %}">REGISTRO</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="{% url 'ISESION' %}">INICIAR SESION</a>
                            </li>
                        {% endif %}
                    </ul>
            </div>
        </div>
    </nav>

    <!-- ¡AQUÍ ESTÁ LO QUE FALTABA! El espacio donde se inyectarán todas tus páginas -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
